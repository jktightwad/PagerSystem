; PlatformIO project for this test. Open this folder in PlatformIO.
; Uses the pioarduino platform because the official espressif32 platform
; ships Arduino-ESP32 core 2.x and these sketches need core 3.x.

[platformio]
src_dir = .

[env:lolin32_lite]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = lolin32_lite
framework = arduino
monitor_speed = 115200



; ESP32-C3 SuperMini (pins 0-10, 20, 21; 18/19 are USB).
; Avoid strapping pins 2, 8, 9 for external parts. Onboard LED is GPIO 8.
[env:esp32c3_supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_PIN=8


