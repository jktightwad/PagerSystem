; PlatformIO project for this test. Open this folder in PlatformIO.
; Uses the pioarduino platform because the official espressif32 platform
; ships Arduino-ESP32 core 2.x and these sketches need core 3.x.

[platformio]
src_dir = .

[env:lolin32_lite]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = lolin32_lite
framework = arduino
monitor_speed = 115200

lib_deps = https://github.com/playfultechnology/PN5180.git

; ESP32-C3 SuperMini (pins 0-10, 20, 21; 18/19 are USB).
; Avoid strapping pins 2, 8, 9 for external parts. Onboard LED is GPIO 8.
[env:esp32c3_supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPN5180_NSS=7
    -DPN5180_BUSY=3
    -DPN5180_RST=10
    ; To move SPI off the default pins (SCK 4, MISO 5, MOSI 6), uncomment
    ; all three and rewire to match (or use env:esp32c3_supermini_alt_spi):
    ; -DPN5180_SCK=4
    ; -DPN5180_MISO=5
    ; -DPN5180_MOSI=1

lib_deps = https://github.com/playfultechnology/PN5180.git

; Same SuperMini with MISO moved off GPIO 5 (using GPIO 5 as MISO didn't work
; on the bench; the pin itself is fine for other uses, cause not established):
; PN5180 MISO -> GPIO 0, MOSI -> GPIO 1, SCK stays on GPIO 4.
[env:esp32c3_supermini_alt_spi]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPN5180_NSS=7
    -DPN5180_BUSY=3
    -DPN5180_RST=10
    -DPN5180_SCK=4
    -DPN5180_MISO=0
    -DPN5180_MOSI=1
lib_deps = https://github.com/playfultechnology/PN5180.git
