; Pool pager BASE firmware (proof of concept).
; Needs include/secrets.h: copy include/secrets.example.h and fill it in.

[platformio]
default_envs = esp32c3_supermini_alt_spi

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

; ESP32-C3 SuperMini as the base, PN5180 on MISO 0 / MOSI 1 / SCK 4
[env:esp32c3_supermini_alt_spi]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPN5180_NSS=7
    -DPN5180_BUSY=3
    -DPN5180_RST=10
    -DPN5180_SCK=4
    -DPN5180_MISO=0
    -DPN5180_MOSI=1
lib_deps = https://github.com/playfultechnology/PN5180.git

; LOLIN32 Lite as the base (default VSPI pins for the PN5180)
[env:lolin32_lite]
board = lolin32_lite
lib_deps = https://github.com/playfultechnology/PN5180.git
