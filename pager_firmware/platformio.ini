; Pager firmware (POC): hardware + Wi-Fi setup + per-pager web page + OTA.
; Uses the pioarduino platform (Arduino-ESP32 core 3.x).

[env:lolin32_lite]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = lolin32_lite
framework = arduino
monitor_speed = 115200
; app0 / app1 for OTA + a LittleFS area for the remembered Wi-Fi networks
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags = -D WM_NO_GLOBAL_DEBUG
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0
  tzapu/WiFiManager @ ^2.0.17
  ayushsharma82/ElegantOTA @ ^3.1.5

; Over-the-air upload (after one USB upload of the env above):
;   pio run -e lolin32_lite_ota -t upload
; upload_port: the pager's IP (shown on its page, the serial monitor, or the
; "PoolPager-<ip>" hotspot name for a minute after it connects).
; The OTA password comes from the PAGER_OTA_PASSWORD environment variable.
[env:lolin32_lite_ota]
extends = env:lolin32_lite
upload_protocol = espota
upload_port = 192.168.1.50
upload_flags =
    --auth=${sysenv.PAGER_OTA_PASSWORD}
