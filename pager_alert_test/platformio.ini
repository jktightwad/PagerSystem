; PlatformIO project for this test. Open this folder in PlatformIO.
; Uses the pioarduino platform because the official espressif32 platform
; ships Arduino-ESP32 core 2.x and these sketches need core 3.x.

[platformio]
src_dir = .

[env:lolin32_lite]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = lolin32_lite
framework = arduino
monitor_speed = 115200

lib_deps = adafruit/Adafruit NeoPixel@^1.12.0

; Over-the-air upload (after one USB upload with include/secrets.h in place):
;   pio run -e lolin32_lite_ota -t upload
; Set upload_port to the pager's IP if <hostname>.local doesn't resolve.
; The OTA password comes from the PAGER_OTA_PASSWORD environment variable so
; it is never written into this (committed) file.
[env:lolin32_lite_ota]
extends = env:lolin32_lite
upload_protocol = espota
upload_port = pager-1.local
upload_flags =
    --auth=${sysenv.PAGER_OTA_PASSWORD}
